name: keep-awake
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit keep-awake
        env:
          TARGET: chog-mischief.vercel.app/api/cron/keep-awake?source=gh-action
        run: |
          body=$(curl -sS -m 90 --proto-default https -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$TARGET")
          code=$(echo "$body" | tail -n1)
          echo "$body"
          [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'
